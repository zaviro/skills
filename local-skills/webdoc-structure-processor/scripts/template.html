<!DOCTYPE html>
<html lang="zh-CN" class="dark-theme">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <title>{title} - TypeScript Handbook Bilingual Edition</title>
    
    <!-- Link to official CSS -->
    <link rel="stylesheet" href="https://www.typescriptlang.org/styles.bfb6d960800c20409c6f.css">
    
    <!-- Additional custom style for bilingual display -->
    <style>
        body {
            background-color: var(--background-color, #262626);
            color: var(--text-color, #fff);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            font-family: var(--body-font), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        .main-content-block {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }
        
        .lang-zh {
            color: var(--text-muted, #737373);
            font-size: 0.95em;
            margin-top: -0.6em !important;
            margin-bottom: 1.2em !important;
            display: block;
        }
        .dark-theme .lang-zh {
            color: #a3a3a3;
        }
        
        /* h1, h2, h3 bilingual styling */
        h1.lang-zh {
            font-size: 0.8em !important;
            margin-top: -0.5em !important;
            color: var(--text-muted, #737373) !important;
            border: none !important;
            padding-bottom: 0 !important;
        }
        h2.lang-zh {
            font-size: 0.8em !important;
            margin-top: -0.5em !important;
            color: var(--text-muted, #737373) !important;
            border: none !important;
            padding-bottom: 0 !important;
        }
        h3.lang-zh {
            font-size: 0.8em !important;
            margin-top: -0.5em !important;
            color: var(--text-muted, #737373) !important;
            border: none !important;
            padding-bottom: 0 !important;
        }
        
        /* Avoid doubling bullets for bilingual lists */
        li.lang-zh {
            list-style-type: none !important;
            margin-top: -0.4em !important;
            margin-bottom: 0.8em !important;
            padding-left: 0 !important;
        }
        
        /* Floating theme toggle button */
        #theme-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--raised-background-color, #313131);
            border: 1px solid var(--border-color, #444);
            color: var(--text-color, #fff);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--raised-box-shadow);
            z-index: 1000;
            transition: all 0.2s ease;
        }
        #theme-toggle-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="main-content-block">
        <article>
            <div class="whitespace raised">
                <div class="markdown">
                    {content}
                </div>
            </div>
        </article>
    </div>
    
    <!-- Floating Theme Toggle -->
    <button id="theme-toggle-btn" onclick="toggleLocalTheme()" title="切换主题">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    
    <script>
        // Init theme
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme) {
            document.documentElement.className = savedTheme;
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.className = "dark-theme";
        } else {
            document.documentElement.className = "light-theme";
        }
        
        function toggleLocalTheme() {
            const htmlEl = document.documentElement;
            if (htmlEl.classList.contains("dark-theme")) {
                htmlEl.className = "light-theme";
                localStorage.setItem("theme", "light-theme");
            } else {
                htmlEl.className = "dark-theme";
                localStorage.setItem("theme", "dark-theme");
            }
        }
    </script>
</body>
</html>
